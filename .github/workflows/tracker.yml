name: Etihad Flight Daily Tracker

on:
  schedule:
    # 每天執行一次：台北時間上午 07:15 (UTC 23:15)
    # 避開整點尖峰負載以避免 GitHub Actions 排程嚴重延遲
    - cron: '15 23 * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動隨時點擊觸發

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium & system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Etihad Flight Tracker
        env:
          CI: 'true'
          HEADLESS: 'true'
        run: node tracker.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json index.html
          if git diff --staged --quiet; then
            echo "No price or history changes to commit."
          else
            git commit -m "chore: auto-update flight prices [skip ci]"
            git push
          fi

